name: public-fork-write-test
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Test write to upstream
        run: |
          echo "=== PUBLIC FORK WRITE TEST ==="
          echo "GITHUB_TOKEN target repo: ${{ github.repository }}"
          echo ""
          echo "--- Write attempt 1 ---"
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/public-fork-result.txt" \
            -d '{"message":"write from public fork","content":"cHVibGljIGZvcmsgdGVzdA=="}'
          echo ""
          echo "--- Write attempt 2 (HTTP code only) ---"
          curl -s -o /dev/null -w "HTTP_CODE: %{http_code}\n" -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/public-fork-result2.txt" \
            -d '{"message":"write 2","content":"dGVzdCAy"}'
